<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDO</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #app {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            display: flex;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #ddd;
        }
        li:last-child {
            border-bottom: none;
        }
        li span {
            flex-grow: 1;
            cursor: pointer;
        }
        li.completed span {
            text-decoration: line-through;
            color: #888;
        }
        .delete-btn {
            background: none;
            border: none;
            color: #ff3b30;
            font-size: 1rem;
            cursor: pointer;
        }
        form {
            display: flex;
            margin-top: 1rem;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button[type="submit"] {
            padding: 0.5rem 1rem;
            border: none;
            background-color: #007aff;
            color: white;
            border-radius: 4px;
            margin-left: 0.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="app">
    <h1>Lista ToDo</h1>
    <ul id="todo-list"></ul>
    <form id="todo-form">
        <input type="text" id="todo-input" placeholder="Dodaj nowe zadanie" autocomplete="off">
        <button type="submit">Dodaj</button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const todoList = document.getElementById('todo-list');
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const apiUrl = '/api/todos';

        async function fetchTodos() {
            try {
                const response = await fetch(apiUrl);
                const todos = await response.json();
                renderTodos(todos);
            } catch (error) {
                console.error('Failed to fetch todos:', error);
            }
        }

        function renderTodos(todos) {
            todoList.innerHTML = '';
            todos.sort((a, b) => a.id - b.id);
            todos.forEach(todo => {
                const li = document.createElement('li');
                li.dataset.id = todo.id;
                if (todo.completed) {
                    li.classList.add('completed');
                }

                const span = document.createElement('span');
                span.textContent = todo.task;
                span.addEventListener('click', () => toggleTodoStatus(todo.id, !todo.completed));

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = '✖';
                deleteBtn.className = 'delete-btn';
                deleteBtn.addEventListener('click', () => deleteTodo(todo.id));

                li.appendChild(span);
li.appendChild(deleteBtn);
                todoList.appendChild(li);
            });
        }

        async function addTodo(task) {
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task: task, completed: false })
                });
                if (response.ok) {
                    fetchTodos();
                }
            } catch (error) {
                console.error('Failed to add todo:', error);
            }
        }

        async function toggleTodoStatus(id, completed) {
            try {
                const response = await fetch(`${apiUrl}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ completed: completed })
                });
                if (response.ok) {
                    fetchTodos();
                }
            } catch (error) {
                console.error('Failed to update todo:', error);
            }
        }

        async function deleteTodo(id) {
            try {
                const response = await fetch(`${apiUrl}/${id}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    fetchTodos();
                }
            } catch (error) {
                console.error('Failed to delete todo:', error);
            }
        }

        todoForm.addEventListener('submit', e => {
            e.preventDefault();
            const task = todoInput.value.trim();
            if (task) {
                addTodo(task);
                todoInput.value = '';
            }
        });

        fetchTodos();
    });
</script>

</body>
</html>
