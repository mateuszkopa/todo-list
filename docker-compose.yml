services:
  app:
    build: .
    container_name: todo-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/todo-list
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=MegaTajneHaslo
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      mariadb:
        condition: service_started

  mariadb:
    image: mariadb:latest
    container_name: todo-db
    environment:
      - MYSQL_ROOT_PASSWORD=R00Tpa$$w0rd
      - MYSQL_DATABASE=todo-list
      - MYSQL_USER=user
      - MYSQL_PASSWORD=MegaTajneHaslo
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data:
